# React Native's Gradle bundling resolves Babel plugins from wherever @babel/core sits,
# which fails in pnpm's isolated layout (EAS builds); Skåne Trails uses the same setting.
nodeLinker: hoisted

allowBuilds:
  "@firebase/util": true
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - "@expo/cli@58.1.13 || 58.1.18"
  - "@expo/router-server@58.0.15 || 58.0.20"
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo@58.0.16 || 58.0.22
  - "@expo/config@58.0.10"
  - "@expo/fingerprint@0.21.8"
  - "@expo/local-build-cache-provider@58.0.10"
  - "@expo/log-box@58.0.14"
  - "@expo/metro-config@58.0.20"
  - "@expo/prebuild-config@58.0.18"
  - "@expo/schema-utils@58.0.3"
  - babel-preset-expo@58.0.23
  - expo-modules-core@58.0.29
  - "@expo/metro-runtime@58.0.16"
  - expo-router@58.0.29

overrides:
  "brace-expansion@>=5.0.0 <5.0.9": ">=5.0.9"
  "minimatch@>=3.0.0 <3.1.4": ">=3.1.4"
  "rollup@>=4.0.0 <4.59.0": ">=4.59.0"
